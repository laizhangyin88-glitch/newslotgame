apply plugin: 'com.android.application'

def keystoreProperties = new Properties()

def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
  keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Override with ENV
if (System.getenv('STORE_PASSWORD')) {
  keystoreProperties['storePassword'] = System.getenv('STORE_PASSWORD')
}

android {
  aaptOptions {
    noCompress 'assetbundle'
  }

  signingConfigs {
    debug {
      keyAlias 'androiddebugkey'
      storeFile file('debug.keystore')
      storePassword 'android'
      keyPassword 'android'
    }
    release {
      keyAlias 'v3proto'
      storeFile file('release.keystore')
      storePassword keystoreProperties['storePassword']
      keyPassword keystoreProperties['storePassword']
    }
  }

  compileOptions {
    sourceCompatibility 1.8
    targetCompatibility 1.8
  }

  compileSdkVersion 30
  buildToolsVersion "30.0.02"
  defaultConfig {
    applicationId "com.bagelcode.v3"
    minSdkVersion 19
    targetSdkVersion 28
    versionCode project.hasProperty('versionCode') ? project.property('versionCode') as int : 1
    versionName project.hasProperty('versionName') ? project.property('versionName') : "1.0"
    testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
  }
  sourceSets {
    main {
      assets.srcDirs += 'unity/src/main/assets'
      res.srcDirs += 'unity/src/main/res'
      jniLibs.srcDirs += 'unity/src/main/jniLibs'
    }
    local {
      assets.srcDirs += 'amazon-assets'
    }
    team {
      assets.srcDirs += 'amazon-assets'
    }
    qa {
      assets.srcDirs += 'amazon-assets'
    }
  }
  buildTypes {
    local {
      versionNameSuffix "-local"
      // applicationIdSuffix ".test"
      signingConfig signingConfigs.debug
      matchingFallbacks = ['debug', 'release']
    }
    team {
      versionNameSuffix "-team"
      signingConfig signingConfigs.debug
      matchingFallbacks = ['debug', 'release']
    }
    teamcontents {
      versionNameSuffix "-teamcontents"
      signingConfig signingConfigs.debug
      matchingFallbacks = ['debug', 'release']
    }
    qa {
      versionNameSuffix "-qa"
      signingConfig signingConfigs.release
      matchingFallbacks = ['debug', 'release']
    }
    st {
      versionNameSuffix "-st"
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro', 'proguard-amazon.cfg', 'unity/proguard-unity.txt'
      signingConfig signingConfigs.release
      matchingFallbacks = ['release', 'debug']
    }
    prod {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro', 'proguard-amazon.cfg', 'unity/proguard-unity.txt'
      signingConfig signingConfigs.release
      matchingFallbacks = ['release', 'debug']
    }
  }

  packagingOptions {
    doNotStrip '*/armeabi-v7a/*.so'
    doNotStrip '*/x86/*.so'
  }

  flavorDimensions "default"

  productFlavors {
    slots1 {
      def packageName = "com.bagelcode.slots1"
      applicationId packageName

      resValue 'string', 'product_name', 'Club Vegas'
      resValue 'string', 'adjust_app_token', 'qrclojmqdngg'
      resValue 'string', 'adjust_env', 'production'
      resValue 'string', 'adjust_app_secret', '4'
      resValue 'string', 'adjust_info1', '1588140609'
      resValue 'string', 'adjust_info2', '1448106041'
      resValue 'string', 'adjust_info3', '974970781'
      resValue 'string', 'adjust_info4', '2080670404'
      resValue 'string', 'app_download_url', 'amzn://apps/android?p=' + applicationId
    }

    slots3 {
      def packageName = "com.bagelcode.slots3"
      applicationId packageName

      resValue 'string', 'product_name', 'Cash Billionaire'
      resValue 'string', 'adjust_app_token', 'dmyp1500xqm8'
      resValue 'string', 'adjust_env', 'production'
      resValue 'string', 'adjust_app_secret', '7'
      resValue 'string', 'adjust_info1', '1322930257'
      resValue 'string', 'adjust_info2', '1870445566'
      resValue 'string', 'adjust_info3', '867024518'
      resValue 'string', 'adjust_info4', '330440690'
      resValue 'string', 'app_download_url', 'amzn://apps/android?p=' + applicationId
    }
  }

  android.applicationVariants.all { variant ->
    // Facebook, OneSignal
    def facebookAppId, onesignalAppId

    def variantName = variant.getName()
    switch(variantName) {            
      case 'slots1Prod':
        facebookAppId = "1881581215396162"
        onesignalAppId = "f6d06531-c29b-4e9d-83d4-b910c4f6c053"
        break

      case 'slots1Qa':
        facebookAppId = "131332947544414"
        onesignalAppId = "610ba85e-5d31-4afc-b95f-c060ef3a2772"
        break

      case 'slots1Team':
      case 'slots1Teamcontents':
        facebookAppId = "1898338550387095"
        onesignalAppId = "d3818ad5-d87f-4ca0-a067-0a53af0047e7"
        break

      case 'slots3Prod':
        facebookAppId = "462253681467734"
        onesignalAppId = "bd9ed2c5-45db-48bb-bfff-e2088b67817b"
        break

      case 'slots3Qa':
        facebookAppId = "899695047455167"
        onesignalAppId = "9661e45d-6aa1-42fe-ab46-6398eef45b15"
        break

      case 'slots3Team':
        facebookAppId = "801929007067813"
        onesignalAppId = "9e1682c3-aa0f-429d-8e8e-178de7bbf050"
        break

      default:
        facebookAppId = "1898338550387095"
        onesignalAppId = "d3818ad5-d87f-4ca0-a067-0a53af0047e7"
        
        println(variantName)
        break
    }

    def mergedFlavor = variant.getMergedFlavor()
    mergedFlavor.manifestPlaceholders = [
      facebookAppId: facebookAppId
    ]

    variant.resValue 'string', 'facebook_app_id', facebookAppId
    variant.resValue 'string', 'fb_login_protocol_scheme', ("fb" + facebookAppId)
    variant.resValue 'string', 'onesignal_app_id', onesignalAppId


    def appName = variant.mergedFlavor.resValues.get('product_name').getValue()

    if (variant.buildType.name != "prod") {
      appName += " ${variant.buildType.name}"
      variant.resValue 'string', 'adjust_env', 'sandbox'
    }
    // set new resVale
    variant.resValue 'string', 'product_name', appName
  }
}
repositories {
  mavenCentral()
}
dependencies {
  implementation fileTree(include: ['*.jar'], dir: 'libs')
  implementation fileTree(include: ['*.jar'], dir: 'unity/libs')
  androidTestImplementation('com.android.support.test.espresso:espresso-core:2.2.2', {
    exclude group: 'com.android.support', module: 'support-annotations'
  })
  implementation 'com.android.support:appcompat-v7:27.1.1'
  implementation 'com.facebook.android:facebook-android-sdk:9.1.1'
  implementation 'com.theartofdev.edmodo:android-image-cropper:2.7.0'
  implementation 'com.google.android.gms:play-services-analytics:17.0.0'
  
  // Adjust
  implementation 'com.adjust.sdk:adjust-android:4.33.0'
  implementation 'com.android.installreferrer:installreferrer:2.2'
  ////

    // for Onesignal
  implementation 'com.onesignal:OneSignal:[4.0.0, 4.99.99]'

  // SurveyMonkey
  implementation 'com.surveymonkey:surveymonkey-android-sdk:1.0.6'

  testImplementation 'junit:junit:4.12'
  compileOnly files('amazon-libs/amazon-device-messaging-1.0.1.jar')
  implementation(name:'adjust_sig_v2_lib', ext:'aar')
}


task reverseForward(type: Exec) {
  def adb  = android.getAdbExe().toString()
  def forwardLogicCommand = [adb, 'reverse', 'tcp:20000', 'tcp:20000']
  commandLine forwardLogicCommand
  def forwardAdminCommand = [adb, 'reverse', 'tcp:21000', 'tcp:21000']
  commandLine forwardAdminCommand
}
