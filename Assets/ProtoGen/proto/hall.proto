syntax = "proto2";
package hall;
option go_package = "fishserver/hall";

enum HALL_CMD {
    HALL_CMD_LOGIN_Req = 2100;
    HALL_CMD_LOGIN_Rsp = 2101;

	HALL_CMD_HeartHeat_Req = 2102;
	HALL_CMD_HeartHeat_Rsp = 2103;

	HALL_CMD_FishGame_Req = 2104;
	HALL_CMD_FishGame_Rsp = 2105;

	HALL_CMD_EnterGame_Req = 2106;
	HALL_CMD_EnterGame_Rsp = 2107;

	HALL_CMD_ExitGame_Req = 2108;
	HALL_CMD_ExitGame_Rsp = 2109;
}

message HeartHeat
{
	optional uint64 SendTime = 1;
	optional uint64 ReceiveTime = 2;
}

message RoomStatusInfo
{
  optional  uint32 game_id = 1;	//游戏ID
  optional	uint32 room_id = 2; //房间ID
  optional  string room_name = 3;
  optional  uint64 enter_min = 4;
  optional  uint64 enter_max = 5;
  optional  uint32 status = 6; //0  游戏未上线 1 游戏上线
}

message LoginHallReq {
    optional string playerId = 1;
}

message LoginHallRsp {
    optional int32 result = 1;
    repeated RoomStatusInfo rooms = 2;
}

message EnterGameReq
{
	optional uint32 game_id   = 1;			//游戏id
	optional uint32 room_id   = 2;			//房间id
	optional uint32 desk_id   = 3;			//桌子id
	optional uint32 chair_id  = 4;			//座位id
	optional uint32 proxy_id  = 5;			//服务端占用位
}


message EnterGameRsp
{
	optional int32 result         = 1;			//结果码
	optional uint32 chair_count    = 2;
	optional uint32 my_chair_id    = 3;
	optional uint32 game_id        = 4;
	optional uint32 room_id        = 5;
	optional uint32 game_bus_id    = 6;
}


message ExitGameReq
{
	optional uint32 reserved = 1;  
}

message ExitGameRsp
{
	optional uint32 exit_type   = 1;   //0-退出失败(或者状态不对/玩家不在游戏中之类);  1-退出成功
}
